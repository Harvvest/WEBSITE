<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal Login | HARVVEST Stock Market Institution</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <!-- Supabase JS Client library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .admin-login-body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 20%, #101B2E 0%, #070C16 70%);
      padding: 24px;
      font-family: var(--font-body);
      color: var(--text);
    }
    .admin-card {
      width: 100%;
      max-width: 440px;
      background: #142036;
      border: 1px solid rgba(201, 164, 92, 0.25);
      border-radius: var(--radius-md);
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.7), 0 0 30px rgba(201, 164, 92, 0.05);
      padding: 40px 32px;
      position: relative;
      overflow: hidden;
    }
    .admin-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #9C7A3C 0%, #E5B869 50%, #9C7A3C 100%);
    }
    .admin-logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .admin-logo h1 {
      font-family: 'Cinzel', serif;
      font-size: 26px;
      letter-spacing: 0.15em;
      color: #F5F2EB;
      margin: 0;
      line-height: 1.2;
    }
    .admin-logo p {
      font-size: 11px;
      letter-spacing: 0.25em;
      color: var(--accent);
      text-transform: uppercase;
      margin-top: 4px;
      font-weight: 600;
    }
    .admin-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(201, 164, 92, 0.12);
      border: 1px solid rgba(201, 164, 92, 0.28);
      color: #DFC488;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      margin-top: 10px;
      font-family: var(--font-mono);
    }
    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #E2E8F0;
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }
    .input-wrapper {
      position: relative;
    }
    .form-input {
      width: 100%;
      background: #0B1220;
      border: 1px solid #1C2D4A;
      border-radius: var(--radius-sm);
      color: #F5F2EB;
      font-size: 14px;
      padding: 12px 14px;
      transition: all 0.2s ease;
      outline: none;
      box-sizing: border-box;
    }
    .form-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(201, 164, 92, 0.15);
    }
    .toggle-pwd {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 12px;
      padding: 4px;
    }
    .toggle-pwd:hover {
      color: #E2E8F0;
    }
    .btn-login {
      width: 100%;
      background: linear-gradient(135deg, #E5B869 0%, #C9A45C 100%);
      color: #070C16;
      border: none;
      padding: 13px 20px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.03em;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      margin-top: 24px;
    }
    .btn-login:hover:not(:disabled) {
      filter: brightness(1.1);
      box-shadow: 0 4px 15px rgba(201, 164, 92, 0.35);
    }
    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .alert-box {
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 20px;
      display: none;
    }
    .alert-error {
      background: rgba(231, 76, 60, 0.12);
      border: 1px solid rgba(231, 76, 60, 0.35);
      color: #F87171;
    }
    .alert-info {
      background: rgba(201, 164, 92, 0.1);
      border: 1px solid rgba(201, 164, 92, 0.3);
      color: #DFC488;
    }
    .security-note {
      text-align: center;
      margin-top: 24px;
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.6;
    }
    .security-note code {
      font-family: var(--font-mono);
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 5px;
      border-radius: 4px;
    }
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(7, 12, 22, 0.3);
      border-top-color: #070C16;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="admin-login-body">

  <div class="admin-card">
    <div class="admin-logo">
      <h1>HARVVEST</h1>
      <p>Stock Market Institution</p>
      <div class="admin-badge">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        Admin Portal &bull; Stage 1
      </div>
    </div>

    <!-- Alert / Notice Box -->
    <div id="alertBox" class="alert-box" role="alert"></div>

    <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <label for="adminEmail" class="form-label">Admin Email Address</label>
        <div class="input-wrapper">
          <input
            type="email"
            id="adminEmail"
            name="email"
            class="form-input"
            placeholder="admin@harvvest.in"
            required
            autocomplete="email"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="adminPassword" class="form-label">Password</label>
        <div class="input-wrapper">
          <input
            type="password"
            id="adminPassword"
            name="password"
            class="form-input"
            placeholder="••••••••••••"
            required
            autocomplete="current-password"
          />
          <button type="button" class="toggle-pwd" id="togglePassword" aria-label="Toggle password visibility">Show</button>
        </div>
      </div>

      <button type="submit" class="btn-login" id="submitBtn">
        <span id="btnText">Sign In to Dashboard</span>
        <span id="btnSpinner" class="spinner" style="display: none;"></span>
      </button>
    </form>

    <div class="security-note">
      <p><strong>Strict Access Control:</strong> Public registration is disabled.</p>
      <p style="margin-top: 4px;">Only verified Supabase user IDs in the server allowlist (<code>ADMIN_USER_IDS</code>) are granted access.</p>
    </div>
  </div>

  <script>
    (function() {
      const form = document.getElementById('loginForm');
      const emailInput = document.getElementById('adminEmail');
      const passwordInput = document.getElementById('adminPassword');
      const togglePwdBtn = document.getElementById('togglePassword');
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');
      const alertBox = document.getElementById('alertBox');

      let supabaseClient = null;

      function showAlert(message, type = 'error') {
        alertBox.className = 'alert-box ' + (type === 'error' ? 'alert-error' : 'alert-info');
        alertBox.innerHTML = message;
        alertBox.style.display = 'block';
      }

      function hideAlert() {
        alertBox.style.display = 'none';
      }

      function setLoading(isLoading) {
        submitBtn.disabled = isLoading;
        btnText.style.display = isLoading ? 'none' : 'inline';
        btnSpinner.style.display = isLoading ? 'inline-block' : 'none';
      }

      // Password toggle
      togglePwdBtn.addEventListener('click', function() {
        const isPwd = passwordInput.type === 'password';
        passwordInput.type = isPwd ? 'text' : 'password';
        togglePwdBtn.textContent = isPwd ? 'Hide' : 'Show';
      });

      // Initialize Supabase from server public config
      async function init() {
        try {
          const res = await fetch('/api/admin/config');
          const config = await res.json();

          if (!config.configured || !config.supabaseUrl || !config.supabaseAnonKey) {
            showAlert('<strong>Configuration Required:</strong> Supabase credentials (<code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code>) have not been set in the environment yet. Please add them to your environment variables to enable login.', 'info');
            submitBtn.disabled = true;
            return;
          }

          if (window.supabase) {
            supabaseClient = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);

            // Check if already authenticated and session is still valid
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session && session.access_token) {
              // Verify server-side authorization
              try {
                const verifyRes = await fetch('/api/admin/session', {
                  headers: { 'Authorization': `Bearer ${session.access_token}` }
                });
                if (verifyRes.ok) {
                  // Authorized admin, redirect straight to dashboard
                  window.location.replace('/admin');
                  return;
                }
              } catch (e) {
                // Ignore verification probe error and let user log in fresh
              }
            }
          } else {
            showAlert('Failed to load the Supabase client library. Please verify network access.', 'error');
            submitBtn.disabled = true;
          }
        } catch (err) {
          showAlert('Error communicating with authentication server: ' + err.message, 'error');
        }
      }

      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        hideAlert();

        if (!supabaseClient) {
          showAlert('Supabase client is not initialized. Please ensure environment variables are configured.', 'error');
          return;
        }

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
          showAlert('Please provide both email and password.', 'error');
          return;
        }

        setLoading(true);

        try {
          // 1. Authenticate with Supabase Auth
          const { data, error } = await supabaseClient.auth.signInWithPassword({
            email,
            password
          });

          if (error) {
            setLoading(false);
            showAlert('<strong>Authentication Failed:</strong> ' + error.message, 'error');
            return;
          }

          if (!data || !data.session || !data.session.access_token) {
            setLoading(false);
            showAlert('Failed to obtain authentication session from Supabase.', 'error');
            return;
          }

          const token = data.session.access_token;

          // 2. Server-side verification and allowlist enforcement
          const verifyRes = await fetch('/api/admin/session', {
            headers: {
              'Authorization': `Bearer ${token}`
            }
          });

          const verifyData = await verifyRes.json();

          if (!verifyRes.ok) {
            // Sign out of Supabase client since this user is not authorized on server
            await supabaseClient.auth.signOut();
            setLoading(false);

            if (verifyRes.status === 403) {
              showAlert(
                '<strong>Access Denied:</strong> Your account authenticated successfully, but user ID (<code>' +
                (data.user ? data.user.id : 'unknown') +
                '</code>) is not on the server-configured administrator allowlist (<code>ADMIN_ALLOWED_UIDS</code>). Please ensure your user ID is added to the server environment.',
                'error'
              );
            } else {
              showAlert('<strong>Authorization Failed:</strong> ' + (verifyData.error || 'Server rejected credentials.'), 'error');
            }
            return;
          }

          // 3. User is authenticated and verified as authorized admin!
          window.location.replace('/admin');

        } catch (err) {
          setLoading(false);
          showAlert('An unexpected error occurred during login: ' + err.message, 'error');
        }
      });

      // Check URL query parameters for notices
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('reason') === 'unauthorized') {
        showAlert('Your session was unauthorized or has expired. Please sign in again.', 'error');
      } else if (urlParams.get('logged_out') === '1') {
        showAlert('You have signed out successfully.', 'info');
      }

      init();
    })();
  </script>
</body>
</html>
